# The Parley relay with Docker Compose, from this folder.
#
#   PARLEY_RELAY_KEY=$(openssl rand -base64 24) docker compose up -d
#     listens on 127.0.0.1:8787 only: for `tailscale serve`, or a reverse
#     proxy you already run
#
#   PARLEY_DOMAIN=relay.example.com PARLEY_RELAY_KEY=... docker compose --profile tls up -d
#     adds Caddy, which gets a TLS certificate for the domain by itself
#     (ports 80 and 443 must reach this machine)
services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    environment:
      PARLEY_RELAY_KEY: ${PARLEY_RELAY_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - relay-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PARLEY_DOMAIN: ${PARLEY_DOMAIN:?set PARLEY_DOMAIN to the relay's domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [relay]

volumes:
  relay-data:
  caddy-data:
  caddy-config:
